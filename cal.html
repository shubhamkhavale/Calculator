<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Calculator</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 260px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .display {
      background: #222;
      color: #fff;
      font-size: 2rem;
      text-align: right;
      padding: 20px;
      height: 60px;
      overflow-x: auto;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #ccc;
    }

    button {
      font-size: 1.2rem;
      padding: 20px;
      border: none;
      cursor: pointer;
      background: #f9f9f9;
    }

    button:hover {
      background: #e0e0e0;
    }

    .operator {
      background: #facc15;
    }

    .equal {
      background: #34d399;
      grid-column: span 2;
    }

    .clear {
      background: #f87171;
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div id="display" class="display">0</div>
    <div class="buttons">
      <button class="clear">C</button>
      <button class="operator">/</button>
      <button class="operator">*</button>
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="operator">-</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="operator">+</button>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>0</button>
      <button>.</button>
      <button class="equal">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    const buttons = document.querySelectorAll("button");

    let currentInput = "";
    let resultDisplayed = false;

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        const value = button.textContent;

        if (value === "C") {
          currentInput = "";
          display.textContent = "0";
        } 
        else if (value === "=") {
          try {
            currentInput = eval(currentInput).toString();
            display.textContent = currentInput;
          } catch {
            display.textContent = "Error";
          }
        } 
        else {
          if (display.textContent === "0" || resultDisplayed) {
            display.textContent = value;
            currentInput = value;
            resultDisplayed = false;
          } else {
            display.textContent += value;
            currentInput += value;
          }
        }
      });
    });
  </script>
</body>
</html>
